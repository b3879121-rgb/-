<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>楓葉小吃｜訂單後台</title>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="demo">展示版後台：資料來自你在展示版下的訂單（存在瀏覽器）。<a href="index.html">回訂餐頁</a></div>
<div class="awning-wrap"><div class="awning" aria-hidden="true"></div></div>
<div class="admin">
  <h1>訂單後台</h1>
  <section class="summary" aria-labelledby="sum-title">
    <div class="sum-head">
      <h2 id="sum-title">當日統計</h2>
      <label for="date">日期</label>
      <input type="date" id="date">
      <button type="button" id="export" class="export">匯出 Excel</button>
    </div>
    <div class="stats" id="stats"></div>
    <p class="hint">營業額只計算「已完成」的訂單，取消的訂單不計入。</p>
    <div id="top-items"></div>
  </section>
  <div class="filters" id="filters" role="group" aria-label="訂單狀態">
    <button data-s="active" class="on">進行中</button>
    <button data-s="done">已完成</button>
    <button data-s="cancelled">已取消</button>
  </div>
  <p class="meta" id="meta">載入中…</p>
  <p class="flash" id="flash" role="status"></p>
  <div id="orders"></div>
</div>
<script src="admin.js"></script>
</body>
</html>
