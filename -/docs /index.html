<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>楓葉小吃｜線上訂餐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="awning-wrap"><div class="awning" aria-hidden="true"></div></div>
<figure class="hero">
  <img src="{{ hero }}" alt="下雨夜晚的台灣夜市，人們在攤位前吃飯">
  <div class="sign">楓葉小吃</div>
</figure>
<p class="tagline">選好餐點，填寫資料，送出後店裡就會收到訂單。</p>

<main>
  <section aria-labelledby="menu-title">
    <h2 id="menu-title">今日菜單</h2>
    <div id="menu"></div>
  </section>

  <aside class="slip" id="slip" aria-labelledby="slip-title">
    <div id="order-view">
      <h2 id="slip-title">我的訂單</h2>
      <ul class="lines" id="lines"></ul>
      <div class="total"><span>合計</span><span id="total">$0</span></div>
      <form id="form" novalidate>
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
        <label for="phone">電話</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="numeric" required>
        <fieldset>
          <legend>取餐方式</legend>
          <div class="choice">
            <label><input type="radio" name="fulfillment" value="pickup" checked> 到店自取</label>
            <label><input type="radio" name="fulfillment" value="delivery"> 外送</label>
          </div>
        </fieldset>
        <div id="address-wrap" hidden>
          <label for="address">外送地址</label>
          <input type="text" id="address" name="address" autocomplete="street-address">
        </div>
        <label for="note">備註（選填）</label>
        <textarea id="note" name="note" maxlength="200"></textarea>
        <button class="submit" type="submit" id="submit">送出訂單</button>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div class="done" id="done-view" hidden>
      <h2>訂單已送出</h2>
      <div class="id" id="done-id"></div>
      <p>合計 <strong id="done-total"></strong> 元。店家確認後會聯絡你。</p>
      <button type="button" id="again">再訂一筆</button>
    </div>
  </aside>
</main>

<div class="bar" id="bar">
  <span id="bar-sum">尚未選餐</span>
  <button type="button" id="bar-go">看訂單</button>
</div>

<footer>
  照片來自 <a href="https://unsplash.com/?utm_source=maple_order&utm_medium=referral">Unsplash</a>：
  K X I T H V I S U A L S、Xavier Chng、Trista Le、Jonathan Lim、Daily Food Shot、Chinh Le Duc、Uehara Photography、Snappr、Moonyang Lin。
</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
